<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoboDash Assistant</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 12px 16px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; margin: 0; }
    select, button, input { font-size: 16px; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; }
    .msg { max-width: 85%; padding: 10px 14px; margin: 8px 0; border-radius: 12px; white-space: pre-wrap; line-height: 1.4; }
    .user { background: #2563eb; margin-left: auto; }
    .bot { background: #334155; }
    #talking { display: flex; justify-content: center; padding: 8px 16px; }
    #talking[hidden] { display: none; }
    #talking img { width: 96px; height: 96px; object-fit: cover; border-radius: 16px; }
    #chips { padding: 0 16px 8px; display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { background: #1e293b; border: 1px solid #475569; color: #e2e8f0; border-radius: 16px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
    #bar { display: flex; gap: 8px; padding: 12px; background: #1e293b; }
    #input { min-width: 0; flex: 1; padding: 10px; border-radius: 8px; border: none; }
    #bar button { border: none; border-radius: 8px; padding: 10px 14px; background: #2563eb; color: white; cursor: pointer; }
    #bar button.off { background: #475569; }
    @media (max-width: 520px) { #bar { flex-wrap: wrap; } #input { flex-basis: 100%; } }
  </style>
</head>
<body>
  <header>
    <h1>RoboDash 2026 Assistant</h1>
    <select id="lang" aria-label="Language">
      <option value="en-US">English</option>
      <option value="si-LK">සිංහල</option>
    </select>
  </header>
  <main id="chat" aria-live="polite"></main>
  <div id="talking" hidden aria-label="Assistant is talking">
    <img src="/talking.gif" alt="Assistant is talking" />
  </div>
  <div id="chips"></div>
  <div id="bar">
    <input id="input" placeholder="Ask about the rules..." aria-label="Question" />
    <button id="mic" title="Speak">Mic</button>
    <button id="speaker" class="off" title="Read replies aloud">Voice off</button>
    <button id="send">Send</button>
  </div>
  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const langSel = document.getElementById("lang");
    const micBtn = document.getElementById("mic");
    const speakerBtn = document.getElementById("speaker");
    const chips = document.getElementById("chips");
    const talking = document.getElementById("talking");
    let history = [];
    let speakOn = false;
    const starters = [
      "How many people can be in a team?",
      "What is the maximum robot size and voltage?",
      "How is the final score calculated?",
      "How does the time bonus work?",
      "What happens if my robot leaves the track?",
      "How many resets are allowed?",
      "What are the prizes?"
    ];

    starters.forEach((question) => {
      const button = document.createElement("button");
      button.className = "chip";
      button.textContent = question;
      button.onclick = () => { input.value = question; sendMessage(); };
      chips.appendChild(button);
    });

    function addMsg(text, who) {
      const element = document.createElement("div");
      element.className = `msg ${who}`;
      element.textContent = text;
      chat.appendChild(element);
      chat.scrollTop = chat.scrollHeight;
      return element;
    }

    async function speak(text) {
      if (!speakOn) {
        talking.hidden = true;
        return;
      }
      talking.hidden = false;
      try {
        const response = await fetch("/api/speech", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        if (!response.ok) throw new Error("ElevenLabs request failed");
        const audio = new Audio(URL.createObjectURL(await response.blob()));
        audio.onended = () => URL.revokeObjectURL(audio.src);
        const ended = new Promise((resolve) => {
          audio.addEventListener("ended", resolve, { once: true });
        });
        await audio.play();
        await ended;
      } catch (error) {
        console.error(error);
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = langSel.value;
          window.speechSynthesis.speak(utterance);
        }
      } finally {
        talking.hidden = true;
      }
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      chips.style.display = "none";
      talking.hidden = false;
      addMsg(text, "user");
      const waiting = addMsg("Thinking...", "bot");
      if (location.hostname.endsWith(".github.io")) {
        waiting.textContent = "This GitHub Pages preview can show the interface, but chat and voice need the secure API server. Deploy the API on Vercel or run npm start locally.";
        talking.hidden = true;
        return;
      }
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        waiting.textContent = data.reply;
        history.push({ role: "user", parts: [{ text }] });
        history.push({ role: "model", parts: [{ text: data.reply }] });
        await speak(data.reply);
      } catch (error) {
        waiting.textContent = error.message || "Connection problem. Please try again.";
        talking.hidden = true;
        console.error(error);
      }
    }

    document.getElementById("send").onclick = sendMessage;
    input.addEventListener("keydown", (event) => { if (event.key === "Enter") sendMessage(); });
    speakerBtn.onclick = () => {
      speakOn = !speakOn;
      speakerBtn.textContent = speakOn ? "Voice on" : "Voice off";
      speakerBtn.classList.toggle("off", !speakOn);
      if (!speakOn && window.speechSynthesis) window.speechSynthesis.cancel();
    };

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      micBtn.style.display = "none";
    } else {
      micBtn.onclick = () => {
        const recognition = new SpeechRecognition();
        recognition.lang = langSel.value;
        recognition.onresult = (event) => {
          input.value = event.results[0][0].transcript;
          sendMessage();
        };
        recognition.onerror = () => addMsg("Could not hear you. Please try again or type.", "bot");
        recognition.start();
      };
    }
    addMsg("Hi! I can answer questions about the RoboDash 2026 rules. Ask me anything, in English or Sinhala.", "bot");
  </script>
</body>
</html>
